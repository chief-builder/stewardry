# Stewardry's overrides for the broker's stand-in stack (stack tier only).
# Used as a second -f file next to the pinned broker checkout's
# tests/stack/docker-compose.yml; the broker repository is never changed.
# `make test-stack` runs compose with --env-file /dev/null and a clean
# environment, so a local tests/stack/.env (which may point at real vendor
# apps) is never read.
services:
  keycloak:
    environment:
      # A random admin password generated for each stack run; never printed.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${STEWARDRY_STACK_KC_ADMIN_PASSWORD:?generated by the stack tests}
  mcp-gateway:
    environment:
      # Short enough to test the consent timeout without a long wait.
      CONSENT_WAIT_S: "6"
