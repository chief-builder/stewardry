[project]
name = "stewardry"
version = "0.0.1"
description = "A thin internal agent platform with user-scoped permissions, controls, evals, and audit (synthetic portfolio project)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20,<2",
    "anthropic>=1.8,<2",
    "fastapi>=0.141,<1",
    "httpx2>=2.13,<3",
    "jinja2>=3.1,<4",
    "joserfc>=1.7,<2",
    "pydantic>=2.13,<3",
    "python-multipart>=0.0.32,<0.1",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
stewardry = "stewardry.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
    "zizmor==1.30.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown (ADR 0001): nothing newer than this date is resolved.
# `make lock` moves it to 14 days before today and re-locks.
exclude-newer = "2026-09-26T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py314"
# Unmodified upstream copies, checked by hash (third_party/vendor-token-broker/MANIFEST.json).
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake test tokens
# Generated migrations carry SQL CHECK expressions verbatim.
"src/stewardry/platform/db/migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_model: calls the real Anthropic API; runs only with STEWARDRY_LIVE_MODEL=1 (make test-live-model)",
]
filterwarnings = ["error::ResourceWarning"]
addopts = "-q --strict-markers --cov=stewardry --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
